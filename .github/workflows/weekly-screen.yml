name: Weekly Thursday screen

on:
  workflow_dispatch:
  schedule:
    # Safely after the regular US close in both standard and daylight time.
    - cron: "30 23 * * 4"

permissions:
  contents: read

jobs:
  build-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run fast correctness checks
        run: python -m unittest discover -s tests -v
      - name: Build latest completed-Thursday screen
        run: python main.py
      - name: Preserve the dated research artifact
        uses: actions/upload-artifact@v4
        with:
          name: thursday-screen-${{ github.run_id }}
          path: outputs/
          if-no-files-found: error
          retention-days: 90
